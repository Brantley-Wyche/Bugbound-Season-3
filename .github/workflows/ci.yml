name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install --global npm@11.16.0
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck:components
      - run: npm run validate-levels
      - run: npm run build
